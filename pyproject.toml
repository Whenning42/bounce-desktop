[project]
name = "bounce_desktop"
version = "0.4.4"
description = "Hardware-accelerated Linux virtual desktop."
authors = [{name="William Henning", email="wchenningwchenning@gmail.com"}]
license = "MIT"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "evdev>=1.9.3",
    "numpy>=1.26",
    "pysdl2>=0.9.17",
    "pywayland==0.4.18",
    "supervise-redist>=0.6.3",
]

[dependency-groups]
dev = [
    "twine",
]

[project.urls]
Homepage = "https://github.com/Whenning42/bounce-desktop"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bounce_desktop = [
    "labwc_entry.sh",
    "wayland_protocols/*.xml",
]
